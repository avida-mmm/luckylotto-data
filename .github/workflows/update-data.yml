name: 행또 데이터 업데이트

on:
  schedule:
    - cron: "0 12 * * 6"   # 매주 토요일 21:00 KST (= 토요일 12:00 UTC), 20:35 추첨 직후
  workflow_dispatch:
    inputs:
      force_stores:
        description: "판매점 목록도 지금 새로 받기 (보통은 28일마다 자동)"
        type: boolean
        default: false

permissions:
  contents: write   # data-server/out/을 저장소에 커밋해 다음 실행 때 이어받는다
  pages: write
  id-token: write

concurrency:
  group: haengtto-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 동행복권 데이터 받기
        run: node data-server/build.mjs ${{ inputs.force_stores && '--force-stores' || '' }}

      - name: 결과 저장
        run: |
          git config user.name "haengtto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-server/out
          git diff --cached --quiet || git commit -m "데이터 업데이트 $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data-server/out

      - id: deployment
        uses: actions/deploy-pages@v4
